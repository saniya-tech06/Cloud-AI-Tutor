services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in Backend/.env}
      MYSQL_USER: study_tutor_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Backend/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD locally}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    environment:
      DB_HOST: mysql
      DB_USER: study_tutor_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Backend/.env}
      DB_NAME: ${DB_NAME:?Set DB_NAME in Backend/.env}
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - ./Backend/src/uploads:/app/src/uploads
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  mysql_data:
